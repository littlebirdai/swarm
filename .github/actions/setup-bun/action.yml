name: Set up bun
description: >
  Bun at the version CI pins, the current Node.js LTS, and the workspace
  install. The one place a bun bump lands for every CI job.
inputs:
  deps:
    description: >
      "install" runs `bun install` at the repo root; "none" sets up bun alone,
      for a job with no dependencies or an install of its own.
    default: install
  bun-version:
    description: >
      The bun a job runs on: the version the repo pins, unless the job names its own.
    default: "1.4.4"
runs:
  using: composite
  steps:
    # Under --isolate this bun must run a test preload in every file: the web
    # suite's mocks hand each file the first file's modules otherwise.
    - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      with:
        bun-version: ${{ inputs.bun-version }}

    - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version: lts/*
        package-manager-cache: false

    - if: inputs.deps == 'install'
      name: Install dependencies
      shell: bash
      run: bun install
